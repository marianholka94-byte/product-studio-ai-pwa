plugins { id 'com.android.application' }

android {
    namespace 'com.marianholka.productstudioai'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.marianholka.productstudioai'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '1.4.7'
    }

    flavorDimensions += 'environment'
    productFlavors {
        production {
            dimension 'environment'
            resValue 'string', 'app_name', 'PRODUCT STUDIO AI'
            buildConfigField 'String', 'WEB_APP_URL', '"https://product-studio-ai-pwa.pages.dev/?native=1&app=android-1.4.7"'
            buildConfigField 'String', 'WEB_APP_HOST', '"product-studio-ai-pwa.pages.dev"'
        }
        preview {
            dimension 'environment'
            resValue 'string', 'app_name', 'PRODUCT STUDIO AI – TEST'
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            buildConfigField 'String', 'WEB_APP_URL', '"https://feature-commercial-worker-pr.product-studio-ai-pwa.pages.dev/?native=1&app=android-preview"'
            buildConfigField 'String', 'WEB_APP_HOST', '"feature-commercial-worker-pr.product-studio-ai-pwa.pages.dev"'
        }
    }
}
