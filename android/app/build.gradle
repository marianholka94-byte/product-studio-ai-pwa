plugins { id 'com.android.application' }

android {
    namespace 'com.marianholka.productstudioai'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.marianholka.productstudioai'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    flavorDimensions += 'environment'
    productFlavors {
        production {
            dimension 'environment'
            buildConfigField 'String', 'WEB_APP_URL', '"https://feature-social-export-preset.product-studio-ai-pwa.pages.dev/?native=1&app=android-1.3.0"'
            buildConfigField 'String', 'WEB_APP_HOST', '"feature-social-export-preset.product-studio-ai-pwa.pages.dev"'
        }
        preview {
            dimension 'environment'
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            buildConfigField 'String', 'WEB_APP_URL', '"https://feature-commercial-worker-pr.product-studio-ai-pwa.pages.dev/?native=1&app=android-preview"'
            buildConfigField 'String', 'WEB_APP_HOST', '"feature-commercial-worker-pr.product-studio-ai-pwa.pages.dev"'
        }
    }
}
