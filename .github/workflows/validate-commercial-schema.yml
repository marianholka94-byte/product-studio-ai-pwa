name: Validate commercial D1 schema

on:
  push:
    branches:
      - feature/commercial-foundation-schema
      - feature/commercial-worker-preview
    paths:
      - "migrations/**"
      - ".github/workflows/validate-commercial-schema.yml"
  pull_request:
    branches:
      - feature/social-export-presets-2026-11-18
      - feature/commercial-foundation-schema
    paths:
      - "migrations/**"
      - ".github/workflows/validate-commercial-schema.yml"

permissions:
  contents: read

jobs:
  validate-d1-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate migration with SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          import time
          from pathlib import Path

          migration = Path("migrations/0001_commercial_foundation.sql").read_text(encoding="utf-8")
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          db.executescript(migration)
          for migration_path in sorted(Path("migrations").glob("000[2-9]_*.sql")):
              db.executescript(migration_path.read_text(encoding="utf-8"))

          expected = {
              "users", "sessions", "products", "projects", "assets",
              "product_images", "generations", "credit_ledger", "plans",
              "subscriptions", "payment_events", "audit_log", "auth_rate_limits",
          }
          actual = {
              row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing schema tables: {sorted(missing)}")

          violations = list(db.execute("PRAGMA foreign_key_check"))
          if violations:
              raise SystemExit(f"Foreign key violations: {violations}")

          # Tenant-isolation constraints: a user must not attach another user's
          # product, project, asset or generation to their own records.
          db.execute("INSERT INTO users (id,email,created_at,updated_at) VALUES ('u1','one@example.test',1,1)")
          db.execute("INSERT INTO users (id,email,created_at,updated_at) VALUES ('u2','two@example.test',1,1)")
          db.execute("INSERT INTO users (id,email,created_at,updated_at) VALUES ('u3','three@example.test',1,1)")
          db.execute("INSERT INTO products (id,user_id,name,created_at,updated_at) VALUES ('p1','u1','One',1,1)")

          product_columns = {row[1] for row in db.execute("PRAGMA table_info(products)")}
          if "client_operation_id" not in product_columns:
              raise SystemExit("Missing products.client_operation_id idempotency column")
          db.execute("INSERT INTO products (id,user_id,name,client_operation_id,created_at,updated_at) VALUES ('p_idem1','u1','Idempotent','product-operation-123456',1,1)")
          try:
              db.execute("INSERT INTO products (id,user_id,name,client_operation_id,created_at,updated_at) VALUES ('p_idem2','u1','Duplicate','product-operation-123456',1,1)")
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit("Product save idempotency key was not unique per account")
          db.execute("INSERT INTO products (id,user_id,name,client_operation_id,created_at,updated_at) VALUES ('p_idem3','u2','Other tenant','product-operation-123456',1,1)")
          db.execute("INSERT INTO projects (id,user_id,name,created_at,updated_at) VALUES ('pr1','u1','Project one',1,1)")

          project_columns = {row[1] for row in db.execute("PRAGMA table_info(projects)")}
          if "client_operation_id" not in project_columns:
              raise SystemExit("Missing projects.client_operation_id idempotency column")
          db.execute("INSERT INTO projects (id,user_id,name,client_operation_id,created_at,updated_at) VALUES ('pr_idem1','u1','Idempotent','save-operation-123456',1,1)")
          try:
              db.execute("INSERT INTO projects (id,user_id,name,client_operation_id,created_at,updated_at) VALUES ('pr_idem2','u1','Duplicate','save-operation-123456',1,1)")
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit("Project save idempotency key was not unique per account")
          db.execute("INSERT INTO projects (id,user_id,name,client_operation_id,created_at,updated_at) VALUES ('pr_idem3','u2','Other tenant','save-operation-123456',1,1)")
          db.execute("INSERT INTO assets (id,user_id,product_id,kind,r2_key,content_type,byte_size,created_at) VALUES ('a1','u1','p1','product_image','u1/a1','image/jpeg',100,1)")

          def must_reject(label, statement, values):
              try:
                  db.execute(statement, values)
              except sqlite3.IntegrityError:
                  return
              raise SystemExit(f"Tenant isolation test failed: {label} was accepted")

          must_reject("cross-user project/product link",
              "INSERT INTO projects (id,user_id,product_id,name,created_at,updated_at) VALUES (?,?,?,?,?,?)",
              ("pr2","u2","p1","Bad project",1,1))
          must_reject("cross-user product main asset",
              "INSERT INTO products (id,user_id,name,main_asset_id,created_at,updated_at) VALUES (?,?,?,?,?,?)",
              ("p2","u2","Other product","a1",1,1))
          must_reject("cross-user asset/project link",
              "INSERT INTO assets (id,user_id,project_id,kind,r2_key,content_type,byte_size,created_at) VALUES (?,?,?,?,?,?,?,?)",
              ("a2","u2","pr1","other","u2/a2","application/octet-stream",10,1))
          must_reject("cross-user product image",
              "INSERT INTO product_images (product_id,asset_id,user_id,created_at) VALUES (?,?,?,?)",
              ("p1","a1","u2",1))

          must_reject("cross-user generation/project link",
              "INSERT INTO generations (id,user_id,project_id,model,duration_seconds,status,prompt_snapshot,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?)",
              ("g_bad","u2","pr1","test-model",5,"queued","test",1,1))

          generation_columns = {row[1] for row in db.execute("PRAGMA table_info(generations)")}
          if not {"client_request_id", "request_fingerprint"}.issubset(generation_columns):
              raise SystemExit("Missing account-bound generation idempotency columns")
          db.execute("INSERT INTO generations (id,user_id,project_id,model,duration_seconds,status,prompt_snapshot,client_request_id,request_fingerprint,created_at,updated_at) VALUES ('g1','u1','pr1','test-model',5,'queued','test prompt','same-request-id','fingerprint-a',1,1)")
          try:
              db.execute("INSERT INTO generations (id,user_id,model,duration_seconds,status,prompt_snapshot,client_request_id,request_fingerprint,created_at,updated_at) VALUES ('g1_dup','u1','test-model',5,'queued','duplicate','same-request-id','fingerprint-b',1,1)")
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit("Generation idempotency key was not unique within one account")
          db.execute("INSERT INTO generations (id,user_id,model,duration_seconds,status,prompt_snapshot,client_request_id,request_fingerprint,created_at,updated_at) VALUES ('g2','u2','test-model',5,'queued','other tenant','same-request-id','fingerprint-c',1,1)")
          now = int(time.time())
          for index in range(3):
              db.execute("INSERT INTO generations (id,user_id,model,duration_seconds,status,prompt_snapshot,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?)",
                  (f"g3_{index}","u3","test-model",5,"queued","daily quota test",now,now))
          must_reject("fourth generation within the UTC day",
              "INSERT INTO generations (id,user_id,model,duration_seconds,status,prompt_snapshot,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?)",
              ("g3_over","u3","test-model",5,"queued","daily quota overflow",now,now))
          must_reject("cross-user credit ledger/generation link",
              "INSERT INTO credit_ledger (id,user_id,generation_id,entry_type,amount,created_at) VALUES (?,?,?,?,?,?)",
              ("cl_bad","u2","g1","charge",-5,1))

          db.execute("INSERT INTO credit_ledger (id,user_id,generation_id,entry_type,amount,idempotency_key,created_at) VALUES ('cl1','u1','g1','reservation',-5,'test-reservation',1)")
          must_reject("negative grant amount",
              "INSERT INTO credit_ledger (id,user_id,entry_type,amount,created_at) VALUES (?,?,?,?,?)",
              ("cl_bad_sign_1","u1","grant",-5,1))
          must_reject("positive charge amount",
              "INSERT INTO credit_ledger (id,user_id,entry_type,amount,created_at) VALUES (?,?,?,?,?)",
              ("cl_bad_sign_2","u1","charge",5,1))
          must_reject("credit ledger update",
              "UPDATE credit_ledger SET amount = -1 WHERE id = ?",
              ("cl1",))
          must_reject("credit ledger delete",
              "DELETE FROM credit_ledger WHERE id = ?",
              ("cl1",))

          db.execute("INSERT INTO assets (id,user_id,product_id,kind,r2_key,content_type,byte_size,created_at) VALUES ('a3','u1','p1','product_image','u1/a3','image/jpeg',100,1)")
          db.execute("INSERT INTO product_images (product_id,asset_id,user_id,is_primary,created_at) VALUES ('p1','a1','u1',1,1)")
          must_reject("second primary image",
              "INSERT INTO product_images (product_id,asset_id,user_id,is_primary,created_at) VALUES (?,?,?,?,?)",
              ("p1","a3","u1",1,2))

          for index in range(4, 7):
              asset_id = f"a{index}"
              db.execute(
                  "INSERT INTO assets (id,user_id,product_id,kind,r2_key,content_type,byte_size,created_at) VALUES (?,?,?,?,?,?,?,?)",
                  (asset_id,"u1","p1","product_image",f"u1/{asset_id}","image/jpeg",100,1)
              )
          db.execute("INSERT INTO product_images (product_id,asset_id,user_id,is_primary,created_at) VALUES ('p1','a3','u1',0,2)")
          db.execute("INSERT INTO product_images (product_id,asset_id,user_id,is_primary,created_at) VALUES ('p1','a4','u1',0,3)")
          db.execute("INSERT INTO product_images (product_id,asset_id,user_id,is_primary,created_at) VALUES ('p1','a5','u1',0,4)")
          db.execute("INSERT INTO product_images (product_id,asset_id,user_id,is_primary,created_at) VALUES ('p1','a6','u1',0,5)")
          must_reject("sixth product image",
              "INSERT INTO product_images (product_id,asset_id,user_id,is_primary,created_at) VALUES (?,?,?,?,?)",
              ("p1","a7","u1",0,6))

          # Financial and generated-media history must not disappear through
          # parent deletion. Explicit detach/archive flows belong in the app.
          must_reject("delete product with retained asset",
              "DELETE FROM products WHERE id = ?", ("p1",))
          must_reject("delete project with generation history",
              "DELETE FROM projects WHERE id = ?", ("pr1",))
          must_reject("delete generation referenced by credit ledger",
              "DELETE FROM generations WHERE id = ?", ("g1",))

          print(f"Commercial D1 schema valid: {len(expected)} tables; tenant isolation, generation idempotency/daily quota, primary-image and immutable-credit-ledger constraints passed.")
          PY
