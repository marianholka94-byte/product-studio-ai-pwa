name: Build restored PRODUCT STUDIO AI APK

on:
  push:
    paths:
      - ".github/workflows/build-restored-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified stable backup with splash fix
        uses: actions/checkout@v4
        with:
          ref: restore/stable-2026-11-20-v2-android-build
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses and install packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build production APK
        working-directory: android
        run: gradle --no-daemon :app:assembleProductionDebug
      - name: Verify APK package and integrity
        run: |
          APK="android/app/build/outputs/apk/production/debug/app-production-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 25000
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools/35.0.0" -name apksigner -type f | head -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK" | tail -n 2
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PRODUCT-STUDIO-AI-RESTORED-APK
          path: android/app/build/outputs/apk/production/debug/app-production-debug.apk
          if-no-files-found: error
          retention-days: 30
