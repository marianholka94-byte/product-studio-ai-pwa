name: Build isolated Android preview APK

on:
  push:
    branches:
      - feature/commercial-worker-preview
    paths:
      - "android/**"
      - ".github/workflows/android-preview-apk.yml"
  pull_request:
    branches:
      - feature/commercial-worker-preview
    paths:
      - "android/**"
      - ".github/workflows/android-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build isolated preview APK
        run: gradle -p android --no-daemon assemblePreviewDebug
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: product-studio-ai-android-preview
          path: android/app/build/outputs/apk/preview/debug/*.apk
          if-no-files-found: error
          retention-days: 7
