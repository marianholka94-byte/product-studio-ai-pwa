name: Validate BytePlus Seedance integration

on:
  pull_request:
    branches:
      - feature/commercial-worker-preview
    paths:
      - "worker-preview.js"
      - "index.html"
      - "scripts/validate-generation-safety.mjs"
      - ".github/workflows/validate-byteplus-pr.yml"

permissions:
  contents: read

jobs:
  validate-byteplus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker-preview.js
      - name: Check validator syntax
        run: node --check scripts/validate-generation-safety.mjs
      - name: Validate BytePlus integration and billing safety
        run: node scripts/validate-generation-safety.mjs
