name: Apply commercial preview D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize preview deployment and D1 migration operations across workflows.
concurrency:
  group: commercial-preview-deploy
  cancel-in-progress: false

jobs:
  migrate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/commercial-worker-preview
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply pending D1 migrations to preview only
        run: npx --yes wrangler@4 d1 migrations apply DB --remote --config wrangler.preview.toml --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
