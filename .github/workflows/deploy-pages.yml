name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app-navigation.js"
      - "cloud-library.js"
      - "i18n.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "splash.gif"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy production PWA to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy . --project-name=product-studio-ai-pwa --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
