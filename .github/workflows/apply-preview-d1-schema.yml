name: Apply preview D1 schema

on:
  workflow_dispatch:
  push:
    branches:
      - feature/commercial-foundation-schema
    paths:
      - ".github/workflows/apply-preview-d1-schema.yml"
      - "migrations/0001_commercial_foundation.sql"

permissions:
  contents: read

jobs:
  apply-preview-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commercial foundation branch
        uses: actions/checkout@v4
        with:
          ref: feature/commercial-foundation-schema

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply schema to preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          npx --yes wrangler@4 d1 execute product-studio-ai-db-preview --remote --file=migrations/0001_commercial_foundation.sql --yes

      - name: Verify created tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute product-studio-ai-db-preview --remote --command="SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;" --yes
