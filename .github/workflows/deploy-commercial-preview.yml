name: Deploy commercial preview Worker

on:
  push:
    branches:
      - feature/commercial-worker-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commercial preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply pending preview D1 migrations before deployment
        run: npx --yes wrangler@4 d1 migrations apply DB --remote --config wrangler.preview.toml --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check preview Worker JavaScript syntax
        run: node --check worker-preview.js
      - name: Validate preview Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy isolated preview Worker
        run: npx --yes wrangler@4 deploy --config wrangler.preview.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test deployed D1 and R2 connectivity
        run: |
          response="$(curl --retry 8 --retry-delay 3 --retry-all-errors --fail --silent --show-error https://product-studio-ai-commercial-preview.marianholka94.workers.dev/api/health)"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "$response" | grep -q '"d1":true'
          echo "$response" | grep -q '"r2":true'
          echo "$response" | grep -q '"passwordHash":true'
          echo "$response" | grep -q '"sessionTokenHash":true'
          echo "$response" | grep -q '"rateLimitsTable":true'
          unauthenticated_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://product-studio-ai-commercial-preview.marianholka94.workers.dev/api/products)"
          test "$unauthenticated_status" = "401"
